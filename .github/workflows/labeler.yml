name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      # Keep this workflow free of PR checkouts or PR code execution: it has write access
      # even for pull requests from forks.
      - name: Label changed areas and definition additions and removals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Edit these lists to change which paths receive each label.
            // directories: includes every file below each directory (keep the trailing /).
            // files: exact repository-relative paths. names: filenames at any depth.
            // patterns: glob patterns, e.g. helper/update-flake.* (* stays within a filename).
            // Areas may overlap. Keep labels aligned with the repository's labels:
            // https://github.com/bitcoinix/bitcoinix/labels
            const areaRules = {
              'area: ci': {
                directories: [
                  '.github/',
                  'test/',
                  'dev/'
                ]
              },
              'area: docs': {
                directories: [
                  'docs/',
                  'examples/',
                  'assets/'
                ],
                files: [
                  'SECURITY.md',
                  'book.toml'
                ],
                names: [
                  'README.md'
                ]
              },
              'area: modules': {
                directories: [
                  'modules/'
                ],
                files: [
                  'pkgs/lib.nix'
                ]
              },
              'area: packages': {
                directories: [
                  'pkgs/'
                ],
                files: [
                  'flake.nix',
                  'flake.lock',
                  'default.nix',
                  'helper/update-fixed-output-derivation.sh'
                ],
                patterns: [
                  'helper/update-flake.*'
                ]
              },
              'area: release': {
                directories: [
                  'helper/release-keys/'
                ],
                files: [
                  'helper/fetch-release.sh',
                  'helper/make-release.sh',
                  'test/fetch-release-test.sh',
                  'test/make-release-test.sh',
                  'test/release-keys-test.sh',
                  'examples/nix-bitcoin-release.nix',
                  '.github/workflows/release.yml'
                ]
              }
            };

            const {matchesGlob} = require('node:path');
            function matchesPath(path, rule) {
              return (rule.directories ?? []).some(dir => path.startsWith(dir)) ||
                (rule.files ?? []).includes(path) ||
                (rule.names ?? []).includes(path.split('/').pop()) ||
                (rule.patterns ?? []).some(pattern => matchesGlob(path, pattern));
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const labels = new Set();
            for (const {filename, status} of files) {
              for (const [label, rule] of Object.entries(areaRules)) {
                if (matchesPath(filename, rule)) labels.add(label);
              }

              const isModule = /^modules\/.+\.nix$/.test(filename);
              const isPackage = /^pkgs\/.+\.nix$/.test(filename);
              if (!isModule && !isPackage) continue;

              if (status === 'added') labels.add('type: feature');
              if (status === 'removed') labels.add('type: removal');
            }
            // Only add labels; other type labels, status and breaking labels are manual.
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [...labels]
              });
            }
